<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Interview Practice Question Bank</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/index.html">
                <span class="fw-bold">Interview Practice Question Bank</span>
            </a>
            <div class="ms-auto" id="navbar-auth-section">
                <!-- dynamic -->
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4 p-sm-5">
                            <div class="text-center mb-4">
                                <h3 class="fw-bold">Sign In</h3>
                                <p class="text-muted small">Access your practice dashboard and question history</p>
                            </div>

                            <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>

                            <form id="login-form" novalidate>
                                <div class="mb-3">
                                    <label for="email" class="form-label fw-semibold">Email Address</label>
                                    <input type="email" class="form-control" id="email" required placeholder="name@example.com">
                                    <div class="invalid-feedback">Please enter a valid email address.</div>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label fw-semibold">Password</label>
                                    <input type="password" class="form-control" id="password" required placeholder="••••••••">
                                    <div class="invalid-feedback">Please enter your password.</div>
                                </div>

                                <button type="submit" id="btn-submit" class="btn btn-primary w-100 py-2 mt-2 fw-semibold">
                                    Login
                                </button>
                            </form>

                            <div class="mt-4 pt-3 border-top text-center text-muted small">
                                Don't have an account? <a href="/register.html" class="fw-semibold text-primary">Register here</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p class="mb-0 text-muted small">Interview Practice Question Bank &copy; 2026</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
